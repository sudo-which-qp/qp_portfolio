server {
    listen 80;
    server_name www.godsendjoseph.dev;
    return 301 https://godsendjoseph.dev$request_uri;
}

server {
    listen 80;
    server_name godsendjoseph.dev;
    root /usr/share/nginx/html;
    index index.html;

    location ~ "^/\.(env|git|svn|hg|htaccess|htpasswd|DS_Store)" {
        return 444;
    }

    location ~* "^/(wp-|wordpress|phpmyadmin|xmlrpc|cgi-bin|vendor|actuator)" {
        return 444;
    }

    location ~* "\.(php|asp|aspx|jsp|cgi|sql|bak|zip|tar|gz|ini|ya?ml)$" {
        return 444;
    }

    # ---- your app (unchanged) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}